# Typed translations: context.t.<key>, or Translations.instance outside widgets.
# Generated by build_runner (CI already runs it) or `dart run kuma generate`.
output: lib/app/l10n/translations.g.dart

namespaces:
  core: { package: praises_core, class: CoreTranslations }
  feature: { package: praises_feature_impl, class: FeatureTranslations }

# Micro-apps with their own assets/translations/<id>/ files. Each gets its own
# generated class (context.T.kidsHome) and joins the overlap check.
micro_apps:
  kids:
    locales: [en]

# Looked up dynamically (book pickers, calendars), so they keep the
# context.localize(key) API. They are still validated.
exclude:
  # Bible books — keys from lib/features/books/presentation/book_util.dart
  - Genesis
  - Exodus
  - Leviticus
  - Numbers
  - Deuteronomy
  - Joshua
  - Judges
  - Ruth
  - "[1-3]*"
  - Ezra
  - Nehemiah
  - Esther
  - Job
  - Psalms
  - Proverbs
  - Ecclesiastes
  - songOfSolomon
  - Isaiah
  - Jeremiah
  - Lamentations
  - Ezekiel
  - Daniel
  - Hosea
  - Joel
  - Amos
  - Obadiah
  - Jonah
  - Micah
  - Nahum
  - Habakkuk
  - Zephaniah
  - Haggai
  - Zechariah
  - Malachi
  - Matthew
  - Mark
  - Luke
  - John
  - Acts
  - Romans
  - Galatians
  - Ephesians
  - Philippians
  - Colossians
  - Titus
  - Philemon
  - Hebrews
  - James
  - Jude
  - Revelation
  # Weekdays and months — lib/features/calendar/presentation/widgets/calender_sheet.dart
  - Sun
  - Mon
  - Tue
  - Wed
  - Thu
  - Fri
  - Sat
  - January
  - February
  - March
  - April
  - May
  - June
  - July
  - August
  - September
  - October
  - November
  - December

param_names:
  resendIn: [time]
  donateTo: [ngoName]
  greetingViewTitle: [name]
